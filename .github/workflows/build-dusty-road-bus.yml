name: Build Dusty Road Bus (Windows .exe)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dusty-road-bus/**'
      - '.github/workflows/build-dusty-road-bus.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dusty-road-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: DustyRoadBus-windows
          path: |
            dusty-road-bus/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dusty-road-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: DustyRoadBus-linux
          path: dusty-road-bus/dist/*.AppImage

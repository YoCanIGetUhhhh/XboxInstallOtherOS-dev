name: Build new ANGLE for Xbox (test)

# Builds Google's current ANGLE (OpenGL ES on Direct3D 11) as Xbox/UWP app DLLs, checks them against the
# UWP-allowed function list and keeps them as the "angle-new" download. The app itself is not changed.

on:
  workflow_dispatch:
    inputs:
      angle_ref:
        description: "ANGLE branch or commit to build (main = newest)"
        type: string
        default: "main"

jobs:
  angle:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      DEPOT_TOOLS_UPDATE: "1"
    steps:
      - name: Get the code (for the checker script)
        uses: actions/checkout@v4

      - name: Get depot_tools (Google's build helpers)
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get the ANGLE source and its tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/angle/angle C:\angle
          cd C:\angle
          git checkout "${{ inputs.angle_ref }}"
          git log -1 --format="ANGLE commit %h %ad" --date=short | Tee-Object -FilePath $env:GITHUB_WORKSPACE\angle-report.txt
          python scripts/bootstrap.py
          $ok = $false
          foreach ($try in 1, 2, 3) {
            gclient sync --no-history --shallow -j 8 2>&1 | Out-File -Encoding utf8 $env:GITHUB_WORKSPACE\angle-sync.txt
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "gclient sync attempt $try failed, trying again"
            Start-Sleep -Seconds 30
          }
          Get-Content $env:GITHUB_WORKSPACE\angle-sync.txt | Select-Object -Last 40
          if (-not $ok) { Write-Host "::error title=gclient sync failed::$((Get-Content $env:GITHUB_WORKSPACE\angle-sync.txt | Select-Object -Last 15) -join ' | ')"; exit 1 }

      - name: Hide incomplete Windows SDK versions (so the build picks a complete one)
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $rep = @()
          foreach ($sub in "Include", "Lib", "bin") {
            Get-ChildItem "$kit\$sub" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' } | ForEach-Object { $rep += "$sub\$($_.Name)" }
          }
          $good = Get-ChildItem "$kit\Include" -Directory | Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\um\windows.h") -and (Test-Path "$kit\Lib\$($_.Name)\um\x64\WindowsApp.lib") } | ForEach-Object { $_.Name }
          $rep += "complete SDKs: $($good -join ', ')"
          foreach ($sub in "Include", "Lib", "bin") {
            Get-ChildItem "$kit\$sub" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.' -and ($good -notcontains $_.Name) } | ForEach-Object {
              Rename-Item $_.FullName ($_.Name + ".hidden"); $rep += "hidden: $sub\$($_.Name)"
            }
          }
          $rep | Tee-Object -FilePath $env:GITHUB_WORKSPACE\angle-sdk.txt

      - name: Configure ANGLE for Xbox apps (UWP, x64, Direct3D 11 only)
        shell: pwsh
        run: |
          cd C:\angle
          # Google's build asks for one exact Windows SDK version; use the complete one this machine has instead.
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdk = Get-ChildItem "$kit\Include" -Directory | Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' -and (Test-Path "$($_.FullName)\um\windows.h") } | Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty Name
          Write-Host "Using Windows SDK $sdk"
          foreach ($f in "build\vs_toolchain.py", "build\toolchain\win\setup_toolchain.py") {
            $c = Get-Content $f -Raw
            $found = [regex]::Matches($c, "10\.0\.\d{5}\.0") | ForEach-Object { $_.Value } | Sort-Object -Unique
            Write-Host "$f mentions: $($found -join ', ')"
            foreach ($v in $found) { if ($v -ne $sdk) { $c = $c.Replace($v, $sdk) } }
            Set-Content -NoNewline -Encoding utf8 $f $c
            "$f : $($found -join ', ') -> $sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_WORKSPACE\angle-sdk.txt
          }
          # Google's build targets a newer Windows than SDK 26100 knows (NTDDI_WIN11_BR). Use the newest name this SDK has.
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkh = Get-Content "$kit\Include\$sdk\shared\sdkddkver.h" -Raw
          $names = [regex]::Matches($sdkh, "#define\s+(NTDDI_WIN1[01]_[A-Z0-9]+)\s+0x([0-9A-Fa-f]+)") | ForEach-Object { [pscustomobject]@{ n = $_.Groups[1].Value; v = [Convert]::ToInt64($_.Groups[2].Value, 16) } }
          $best = ($names | Sort-Object v | Select-Object -Last 1).n
          if (-not $best) { Write-Host "::error::no NTDDI names found in sdkddkver.h"; exit 1 }
          "newest NTDDI name in SDK: $best" | Out-File -Append -Encoding utf8 $env:GITHUB_WORKSPACE\angle-sdk.txt
          $hits = Get-ChildItem build -Recurse -Include *.gn, *.gni | Select-String -Pattern "NTDDI_WIN1[01]_[A-Z0-9]+" -List
          foreach ($h in $hits) {
            $c = Get-Content $h.Path -Raw
            $used = [regex]::Matches($c, "NTDDI_WIN1[01]_[A-Z0-9]+") | ForEach-Object { $_.Value } | Sort-Object -Unique
            foreach ($u in $used) { if (-not ($names.n -contains $u)) { $c = $c.Replace($u, $best); "$($h.Path): $u -> $best" | Out-File -Append -Encoding utf8 $env:GITHUB_WORKSPACE\angle-sdk.txt } }
            Set-Content -NoNewline -Encoding utf8 $h.Path $c
          }
          New-Item -ItemType Directory -Force out\uwp | Out-Null
          # Written to args.gn directly (passing quotes on the command line gets them stripped by Windows).
          @(
            'target_os = "winuwp"'
            'target_cpu = "x64"'
            'is_debug = false'
            'is_component_build = false'
            'angle_enable_vulkan = false'
            'angle_enable_gl = false'
            'angle_enable_d3d9 = false'
            'angle_enable_null = false'
            'angle_enable_swiftshader = false'
            'angle_build_tests = false'
            'angle_has_frame_capture = false'
            'angle_libs_suffix = "_new"'
            'treat_warnings_as_errors = false'
          ) | Set-Content -Encoding ascii out\uwp\args.gn
          Get-Content out\uwp\args.gn
          gn gen out/uwp 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\angle-gn.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=gn gen failed::$((Get-Content $env:GITHUB_WORKSPACE\angle-gn.txt -Raw) -replace "`r?`n", ' | ')"; exit 1 }

      - name: Build libEGL.dll and libGLESv2.dll
        shell: pwsh
        run: |
          cd C:\angle
          autoninja -C out/uwp libEGL libGLESv2 2>&1 | Tee-Object -FilePath $env:GITHUB_WORKSPACE\angle-build.txt | Select-Object -Last 60
          if ($LASTEXITCODE -ne 0) {
            # Keep the compiler's own error text for the notes.
            $o = "out\uwp\siso_output"
            if (Test-Path $o) {
              $lines = Get-Content $o
              $hit = ($lines | Select-String -Pattern "error" | Select-Object -First 1)
              $start = if ($hit) { [Math]::Max(0, $hit.LineNumber - 15) } else { [Math]::Max(0, $lines.Count - 80) }
              $lines[$start..([Math]::Min($lines.Count - 1, $start + 80))] | Out-File -Encoding utf8 $env:GITHUB_WORKSPACE\angle-error.txt
            } else { "no siso_output; files: $((Get-ChildItem out\uwp -File).Name -join ', ')" | Out-File -Encoding utf8 $env:GITHUB_WORKSPACE\angle-error.txt }
            exit 1
          }

      - name: Check the DLLs against the UWP-allowed list
        shell: pwsh
        run: |
          python -m pip install pefile | Out-Null
          $lib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Recurse -Filter WindowsApp.lib | Where-Object { $_.FullName -match "\\um\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          $nm = Get-ChildItem "C:\Program Files\LLVM\bin\llvm-nm.exe", "C:\angle\third_party\llvm-build\Release+Asserts\bin\llvm-nm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "WindowsApp.lib: $lib  nm: $nm"
          & $nm -g $lib 2>$null | Out-File -Encoding utf8 windowsapp_symbols.txt
          New-Item -ItemType Directory angle-new | Out-Null
          Copy-Item C:\angle\out\uwp\libEGL*.dll, C:\angle\out\uwp\libGLESv2*.dll angle-new\
          Get-ChildItem C:\angle\out\uwp\*.dll | ForEach-Object { "$($_.Name) $([int]($_.Length/1024)) KB" } | Tee-Object -FilePath angle-dlls.txt
          python native/uwp_audit.py (Get-ChildItem angle-new\libGLESv2*.dll | Select-Object -First 1 -ExpandProperty FullName) windowsapp_symbols.txt angle-new 2>&1 | Tee-Object -FilePath angle-audit.txt
          python native/uwp_audit.py (Get-ChildItem angle-new\libEGL*.dll | Select-Object -First 1 -ExpandProperty FullName) windowsapp_symbols.txt angle-new 2>&1 | Tee-Object -FilePath angle-audit.txt -Append

      - name: Keep the DLLs
        uses: actions/upload-artifact@v4
        with:
          name: angle-new
          path: angle-new/
          retention-days: 14

      - name: Post the results as readable notes
        if: always()
        shell: pwsh
        run: |
          function Emit($title, $file, $tail) {
            if (-not (Test-Path $file)) { Write-Host "::notice title=$title::file missing: $file"; return }
            $lines = Get-Content $file
            if ($tail -gt 0) { $lines = $lines | Select-Object -Last $tail }
            $text = ($lines -join "`n")
            $i = 0
            while ($text.Length -gt 0 -and $i -lt 6) {
              $chunk = $text.Substring(0, [Math]::Min(3500, $text.Length)); $text = $text.Substring($chunk.Length); $i++
              $m = $chunk.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Host "::notice title=$title ($i)::$m"
            }
          }
          Emit "ANGLE REPORT" angle-report.txt 0
          Emit "ANGLE SYNC (tail)" angle-sync.txt 25
          Emit "ANGLE SDK" angle-sdk.txt 0
          Emit "ANGLE GN" angle-gn.txt 40
          Emit "ANGLE ERROR" angle-error.txt 0
          Emit "ANGLE BUILD (tail)" angle-build.txt 15
          Emit "ANGLE DLLS" angle-dlls.txt 0
          Emit "ANGLE AUDIT" angle-audit.txt 0

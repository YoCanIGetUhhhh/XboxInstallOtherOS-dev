<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dusty Road Bus</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#hud{pointer-events:none}
#touch{display:none;position:fixed;left:0;right:0;bottom:90px;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch .g{display:flex;gap:10px}
#touch button{pointer-events:auto;touch-action:none;width:74px;height:74px;border-radius:16px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font:700 14px system-ui}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch"><div class="g"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div><div class="g"><button data-k="down">BRAKE</button><button data-k="up">GAS</button></div></div>
<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';
/* ============================ setup ============================ */
const glCanvas = document.getElementById('gl'), hudCanvas = document.getElementById('hud');
const ctx = hudCanvas.getContext('2d');
const FONT = 'system-ui, "Segoe UI", Roboto, sans-serif';
let W = 0, H = 0, U = 1;
const MAXV = 25, ACC = 3.6, BRK = 9.5, COAST = 1.7, OFFLIM = 0.55 * MAXV, OFFDEC = 7;
const HOURS_PER_SEC = 1 / 16;      // a full day lasts ~6.4 minutes
const ROAD_HALF = 4.2, DS = 2, CH = 120, DRAW_AHEAD = 720, DRAW_BEHIND = 140;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xcccccc, 30, 450);
const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 1600);
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false);
  W = hudCanvas.width = Math.max(320, Math.floor(innerWidth * dpr)); H = hudCanvas.height = Math.max(240, Math.floor(innerHeight * dpr));
  U = H / 720; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ============================ save system ============================ */
const SAVE_VERSION = 2;
let save = { v: SAVE_VERSION, best: 0, totalDist: 0, totalStops: 0, totalPax: 0, runs: 0, muted: false, lightMode: 0, run: null };
const hasDesktop = !!(window.desktop && window.desktop.readSave);
async function loadSave() {
  try {
    const t = hasDesktop ? await window.desktop.readSave() : localStorage.getItem('dustyRoadBus.save3d');
    if (t) { const o = JSON.parse(t); if (o && o.v === SAVE_VERSION) save = Object.assign(save, o); }
  } catch (e) {}
  muted = !!save.muted; lightMode = save.lightMode | 0;
}
function writeSave() {
  const t = JSON.stringify(save);
  try { if (hasDesktop) window.desktop.writeSave(t); else localStorage.setItem('dustyRoadBus.save3d', t); } catch (e) {}
}
function snapshotRun() {
  save.run = { s: busS, d: busD, psi, speed, odo, heat, pax, stops: stopsDone, missed, hour, wxState, wxTimer, cloud: wx.cloud, rain: wx.rain, nextStopIn };
}
function autosave() { if (state === 'play') { snapshotRun(); writeSave(); } }
function commitStats(dist, stops) { save.totalDist += dist; save.totalStops += stops; save.runs++; if (dist > save.best) save.best = dist; }

/* ============================ input ============================ */
const keys = { left: 0, right: 0, up: 0, down: 0 };
const KMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'down' };
addEventListener('keydown', e => {
  if (KMAP[e.code]) { keys[KMAP[e.code]] = 1; e.preventDefault(); }
  if (e.repeat) return;
  initAudio();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state === 'title') startGame(!!save.run);
    else if (state === 'dead' && deadT > 1.8) toTitle();
    else if (state === 'paused') setPaused(false);
  }
  if (e.code === 'KeyN' && state === 'title') startGame(false);
  if (e.code === 'KeyH') { lightMode = (lightMode + 1) % 3; save.lightMode = lightMode; toast('Headlights: ' + ['AUTO', 'ON', 'OFF'][lightMode]); }
  if (e.code === 'KeyM') { muted = !muted; save.muted = muted; if (master) master.gain.value = muted ? 0 : 0.6; writeSave(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') setPaused(true); else if (state === 'paused') setPaused(false); }
  if (e.code === 'KeyF' && hasDesktop) window.desktop.fullscreen();
  if (e.code === 'KeyQ' && hasDesktop && (state === 'title' || state === 'paused')) { autosaveOnExit(); window.desktop.quit(); }
});
addEventListener('keyup', e => { if (KMAP[e.code]) { keys[KMAP[e.code]] = 0; e.preventDefault(); } });
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('#touch button')) return;
  initAudio();
  if (state === 'title') startGame(!!save.run);
  else if (state === 'dead' && deadT > 1.8) toTitle();
  else if (state === 'paused') setPaused(false);
});
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { keys[k] = 1; initAudio(); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, () => keys[k] = 0));
});
function setPaused(p) { if (p && state === 'play') { state = 'paused'; snapshotRun(); writeSave(); } else if (!p && state === 'paused') state = 'play'; }
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
function autosaveOnExit() { if (state === 'play' || state === 'paused') { snapshotRun(); writeSave(); } }
addEventListener('beforeunload', autosaveOnExit);

/* ============================ audio ============================ */
let AC = null, master = null, muted = false, A = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.nb = nb;
    const noise = () => { const s = AC.createBufferSource(); s.buffer = nb; s.loop = true; s.start(); return s; };
    const chain = (src, type, f, q, g) => { const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const ga = AC.createGain(); ga.gain.value = g; src.connect(fl); fl.connect(ga); ga.connect(master); return { fl, ga }; };
    A.o1 = AC.createOscillator(); A.o1.type = 'sawtooth'; A.o1.start();
    A.o2 = AC.createOscillator(); A.o2.type = 'square'; A.o2.start();
    const eg = AC.createGain(); eg.gain.value = 0; const ef = AC.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 320;
    A.o1.connect(ef); const o2g = AC.createGain(); o2g.gain.value = 0.5; A.o2.connect(o2g); o2g.connect(ef); ef.connect(eg); eg.connect(master);
    A.eng = eg; A.engF = ef;
    A.rain = chain(noise(), 'bandpass', 2600, 0.4, 0);
    A.wind = chain(noise(), 'lowpass', 520, 0.7, 0);
    A.rum = chain(noise(), 'lowpass', 190, 0.7, 0);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.setValueAtTime(v, t + Math.max(0.011, d - 0.03)); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function burst(dur, f0, f1, v, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = A.nb;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function sfxBoom() { burst(2.2, 2400, 50, 1.0); if (AC && !muted) { const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.2); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.4); } }
function sfxThunder() { burst(3.2, 380, 40, 0.8, rnd(0.2, 1.8)); }
function updateAudio() {
  if (!AC) return;
  const t = AC.currentTime, sp = speed / MAXV;
  const live = state === 'play' ? 1 : state === 'title' ? 0.4 : 0;
  A.o1.frequency.setTargetAtTime(36 + sp * 90 + (keys.up ? 8 : 0), t, 0.08);
  A.o2.frequency.setTargetAtTime(18 + sp * 45, t, 0.08);
  A.eng.gain.setTargetAtTime(live * (0.07 + 0.07 * sp), t, 0.1);
  A.engF.frequency.setTargetAtTime(240 + sp * 420, t, 0.1);
  A.rain.ga.gain.setTargetAtTime(wx.rain * 0.2, t, 0.6);
  A.wind.ga.gain.setTargetAtTime((0.02 + 0.12 * sp + 0.18 * wx.storm) * (state === 'dead' ? 0.3 : 1), t, 0.4);
  A.rum.ga.gain.setTargetAtTime(state === 'play' && isOff ? 0.45 * (0.25 + sp) : 0, t, 0.1);
}

/* ============================ track (infinite, procedural) ============================ */
const TR = []; let gs = 0, gx = 0, gz = 0, gth = 0;
const TRNG = mulberry(4242);
function newPiece(start) {
  if (TRNG() < 0.35) return { start, L: 60 + TRNG() * 220, K: 0 };
  return { start, L: 160 + TRNG() * 260, K: (TRNG() < 0.5 ? -1 : 1) / (150 + TRNG() * 280) };
}
let piece = { start: 0, L: 200, K: 0 };
const yAt = s => 7 * (Math.sin(s / 700 * 6.2832 + 1.1) - Math.sin(1.1)) + 2.2 * (Math.sin(s / 260 * 6.2832 + 2.2) - Math.sin(2.2)) + 0.5 * (Math.sin(s / 95 * 6.2832 + 0.4) - Math.sin(0.4));
function extendTrack(sMax) {
  while (gs <= sMax) {
    while (gs >= piece.start + piece.L) piece = newPiece(piece.start + piece.L);
    const k = piece.K * Math.sin(Math.PI * (gs - piece.start) / piece.L);
    TR.push({ s: gs, x: gx, y: yAt(gs), z: gz, th: gth, k });
    gth += k * DS; gx += Math.sin(gth) * DS; gz -= Math.cos(gth) * DS; gs += DS;
  }
}
function at(s) {
  extendTrack(s + DS * 3); const f = Math.max(0, s) / DS, i = Math.floor(f), t = f - i, a = TR[i], b = TR[i + 1];
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t), th: lerp(a.th, b.th, t), k: lerp(a.k, b.k, t), slope: (b.y - a.y) / DS };
}
const latEff = (x, k) => { const m = 0.8 / Math.max(1e-6, Math.abs(k)); return (x * k > 0 && Math.abs(x) > m) ? Math.sign(x) * m : x; };
function terrY(s, x) {
  const ax = Math.abs(x), t = smooth((ax - 9) / 32);
  if (t <= 0) return 0;
  return t * (Math.sin(s * 0.011 + x * 0.019) * 5.5 + Math.sin(s * 0.027 - x * 0.013 + 1.3) * 2.8 + Math.sin(s * 0.05 + x * 0.04) * 0.9) + smooth((ax - 70) / 140) * (16 + 14 * Math.sin(s * 0.006 + x * 0.011));
}
const biomeAt = s => { const v = 0.5 + 0.5 * Math.sin(s / 330 + 1.7) * Math.cos(s / 910 + 0.4); return v < 0.36 ? 0 : v < 0.66 ? 1 : 2; };

/* ============================ weather / sky model ============================ */
const SKY = [
  [0, [40, 55, 120], [95, 115, 175], 0.05], [5, [44, 60, 128], [105, 120, 180], 0.07],
  [6, [90, 105, 170], [250, 160, 115], 0.38], [7.5, [100, 160, 228], [245, 212, 175], 0.82],
  [10, [78, 148, 232], [188, 216, 242], 1], [16, [82, 150, 230], [198, 218, 238], 1],
  [17.8, [100, 125, 195], [250, 188, 125], 0.85], [19, [75, 75, 140], [240, 125, 95], 0.42],
  [20.3, [45, 58, 125], [110, 100, 150], 0.12], [24, [40, 55, 120], [95, 115, 175], 0.05]
];
function sampleSky(h) {
  let i = 0; while (i < SKY.length - 2 && h >= SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1], t = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
  return { top: mixc(a[1], b[1], t), hor: mixc(a[2], b[2], t), amb: lerp(a[3], b[3], t) };
}
const WS = {
  clear: { cloud: 0.06, rain: 0, next: ['cloudy'] },
  cloudy: { cloud: 0.55, rain: 0, next: ['clear', 'rain', 'clear'] },
  rain: { cloud: 0.85, rain: 0.55, next: ['cloudy', 'storm', 'storm'] },
  storm: { cloud: 1, rain: 1, next: ['rain'] }
};
let hour = 9, wxState = 'clear', wxTimer = 35, wx = { cloud: 0.06, rain: 0, storm: 0 };
let lightning = 0, boltT = 0, lightTimer = 6, lightLevel = 0, lightMode = 0, wind = 0.3, env = { top: [90, 150, 230], hor: [190, 215, 240], amb: 1, ambEff: 1, fog: [200, 210, 215] };
function updateWeather(dt) {
  hour = (hour + dt * HOURS_PER_SEC) % 24;
  wxTimer -= dt;
  if (wxTimer <= 0) { const n = WS[wxState].next; wxState = n[(Math.random() * n.length) | 0]; wxTimer = rnd(35, 65); }
  const tg = WS[wxState], k = 1 - Math.exp(-dt / 4.5);
  wx.cloud += (tg.cloud - wx.cloud) * k; wx.rain += (tg.rain - wx.rain) * k;
  wx.storm = clamp((wx.rain - 0.45) / 0.55, 0, 1);
  wind = 0.3 + 0.7 * wx.storm * (0.6 + 0.4 * Math.sin(T * 0.7));
  lightning = Math.max(0, lightning - dt * 3.2); boltT = Math.max(0, boltT - dt);
  if (wx.storm > 0.5) {
    lightTimer -= dt;
    if (lightTimer <= 0) { lightning = 1; boltT = 0.3; lightTimer = rnd(2.5, 9) / (0.5 + wx.storm); makeBolt(); setTimeout(() => { lightning = Math.max(lightning, 0.8); }, 130); sfxThunder(); }
  }
}
function updateEnv(dt) {
  const s = sampleSky(hour), cl = wx.cloud, sc2 = 0.35 + 0.65 * s.amb;
  const top = mixc(s.top, [62 * sc2, 70 * sc2, 84 * sc2], cl * 0.8), hor = mixc(s.hor, [112 * sc2, 118 * sc2, 128 * sc2], cl * 0.8);
  let ambEff = s.amb * (1 - 0.5 * cl * (0.6 + 0.4 * wx.rain)); ambEff = Math.min(1, ambEff + lightning * 0.5);
  env = { top, hor, amb: s.amb, ambEff, fog: mixc(hor, [215, 195, 160], 0.22 * (1 - cl) * s.amb) };
  const lon = lightMode === 1 || (lightMode === 0 && ambEff < 0.6);
  lightLevel += ((lon ? 1 : 0) - lightLevel) * Math.min(1, dt * 6);
}

/* ============================ textures & materials ============================ */
function canvasTex(w, h, fn, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.anisotropy = 8; return t;
}
const softTex = canvasTex(64, 64, (g, w, h) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.4, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
const cloudTex = canvasTex(256, 128, (g, w, h) => { for (let i = 0; i < 16; i++) { const x = 40 + Math.random() * 176, y = 50 + Math.random() * 40, r = 24 + Math.random() * 30, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); } });
const moonTex = canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(235,240,225,1)'); r.addColorStop(0.3, 'rgba(235,240,225,1)'); r.addColorStop(0.34, 'rgba(210,225,255,.35)'); r.addColorStop(1, 'rgba(210,225,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(150,160,140,.5)'; [[56, 54, 6], [72, 70, 5], [66, 50, 3]].forEach(([x, y, rr]) => { g.beginPath(); g.arc(x, y, rr, 0, 6.3); g.fill(); }); });
const sunTex = canvasTex(128, 128, (g, w, h) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,250,225,1)'); r.addColorStop(0.1, 'rgba(255,245,210,1)'); r.addColorStop(0.14, 'rgba(255,230,170,.6)'); r.addColorStop(1, 'rgba(255,220,150,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
const roadTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#b8955f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { const v = 150 + Math.random() * 70; g.fillStyle = 'rgba(' + v + ',' + (v * 0.8) + ',' + (v * 0.55) + ',.35)'; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  const rut = (cx) => { const gr = g.createLinearGradient(cx - 22, 0, cx + 22, 0); gr.addColorStop(0, 'rgba(110,80,50,0)'); gr.addColorStop(0.5, 'rgba(110,80,50,.55)'); gr.addColorStop(1, 'rgba(110,80,50,0)'); g.fillStyle = gr; g.fillRect(cx - 22, 0, 44, h); };
  rut(w * 0.5 - 70); rut(w * 0.5 + 70); rut(w * 0.5 - 160); rut(w * 0.5 + 160);
  g.fillStyle = 'rgba(232,220,175,.7)'; for (let i = 0; i < 2; i++) g.fillRect(w / 2 - 4, i * 256 + 20, 8, 80);
  const le = g.createLinearGradient(0, 0, w, 0); le.addColorStop(0, 'rgba(165,138,92,1)'); le.addColorStop(0.08, 'rgba(165,138,92,0)'); le.addColorStop(0.92, 'rgba(165,138,92,0)'); le.addColorStop(1, 'rgba(165,138,92,1)'); g.fillStyle = le; g.fillRect(0, 0, w, h);
}, true);
const gravelTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#857d6c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1800; i++) { const v = 90 + Math.random() * 80; g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 10) + ',.6)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, true);
const noiseTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2500; i++) { const v = 150 + Math.random() * 105; g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',.8)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); } }, true);
const M = {
  terrain: new THREE.MeshLambertMaterial({ vertexColors: true, map: noiseTex }),
  road: new THREE.MeshLambertMaterial({ map: roadTex, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
  gravel: new THREE.MeshLambertMaterial({ map: gravelTex, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }),
  inst: new THREE.MeshLambertMaterial({ color: 0xffffff }),
  wire: new THREE.LineBasicMaterial({ color: 0x1c1a18 }),
  fenceWire: new THREE.LineBasicMaterial({ color: 0x7a7468 })
};
const lam = c => new THREE.MeshLambertMaterial({ color: c });

/* ============================ sky dome, sun, moon, stars, clouds, mountains ============================ */
const skyMat = new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() } }, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vP; void main(){ float h = normalize(vP).y; float t = pow(clamp(h,0.0,1.0),0.5); vec3 c = mix(hor, top, t); if(h<0.0) c = hor; gl_FragColor = vec4(c,1.0); }'
});

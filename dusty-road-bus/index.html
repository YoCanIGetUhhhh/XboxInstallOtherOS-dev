<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dusty Road Bus</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#touch{display:none;position:fixed;left:0;right:0;bottom:90px;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch .g{display:flex;gap:10px}
#touch button{pointer-events:auto;touch-action:none;width:74px;height:74px;border-radius:16px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font:700 14px system-ui}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch"><div class="g"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div><div class="g"><button data-k="down">BRAKE</button><button data-k="up">GAS</button></div></div>
<script>
(() => {
'use strict';
/* ============================ setup ============================ */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const lcv = document.createElement('canvas'), lctx = lcv.getContext('2d');
const FONT = 'system-ui, "Segoe UI", Roboto, sans-serif';
let W = 0, H = 0, U = 1, HOR = 0, PS = 0, camH = 1000, playerZ = 1000, busW = 200;
const SEG = 200, ROADW = 900, DRAW = 260, FOV = 85;
const camDepth = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const MAXSPEED = 4600, ACC = 1000, BRK = 2300, COAST = 420, OFFDEC = 1400;
const HOURS_PER_SEC = 1 / 16;      // full day = 6.4 minutes
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = cv.width = Math.max(320, Math.floor(innerWidth * dpr));
  H = cv.height = Math.max(240, Math.floor(innerHeight * dpr));
  lcv.width = W; lcv.height = H;
  U = H / 720; PS = W / 2; HOR = Math.round(H * 0.4);
  const targetHalf = Math.min(0.5 * H, 0.46 * W);
  camH = ROADW * (0.97 * H - HOR) / targetHalf;
  playerZ = camDepth * camH * PS / (0.97 * H - HOR);
  busW = 0.62 * targetHalf;
}
addEventListener('resize', resize); resize();

/* ============================ save system ============================ */
const SAVE_VERSION = 1;
let save = { v: SAVE_VERSION, best: 0, totalDist: 0, totalStops: 0, totalPax: 0, runs: 0, muted: false, lightMode: 0, run: null };
const hasDesktop = !!(window.desktop && window.desktop.readSave);
async function loadSave() {
  try {
    let t = hasDesktop ? await window.desktop.readSave() : localStorage.getItem('dustyRoadBus.save');
    if (t) { const o = JSON.parse(t); if (o && o.v === SAVE_VERSION) save = Object.assign(save, o); }
  } catch (e) {}
  muted = !!save.muted; lightMode = save.lightMode | 0;
}
let saveBusy = false;
function writeSave() {
  const t = JSON.stringify(save);
  try {
    if (hasDesktop) { window.desktop.writeSave(t); } else { localStorage.setItem('dustyRoadBus.save', t); }
  } catch (e) {}
}
function snapshotRun() {
  save.run = {
    position, playerX, speed, odo, heat, pax, stops: stopsDone, missed, hour, wxState, wxTimer,
    cloud: wx.cloud, rain: wx.rain, nextStopIn
  };
}
function autosave() { if (state === 'play') { snapshotRun(); writeSave(); } }
function commitStats(dist, stops, pax) {
  save.totalDist += dist; save.totalStops += stops; save.totalPax += pax; save.runs++;
  if (dist > save.best) save.best = dist;
}

/* ============================ input ============================ */
const keys = { left: 0, right: 0, up: 0, down: 0 };
const KMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'down' };
addEventListener('keydown', e => {
  if (KMAP[e.code]) { keys[KMAP[e.code]] = 1; e.preventDefault(); }
  if (e.repeat) return;
  initAudio();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state === 'title') startGame(!!save.run);
    else if (state === 'dead' && deadT > 1.8) toTitle();
    else if (state === 'paused') setPaused(false);
  }
  if (e.code === 'KeyN' && state === 'title') startGame(false);
  if (e.code === 'KeyH') { lightMode = (lightMode + 1) % 3; save.lightMode = lightMode; toast('Headlights: ' + ['AUTO', 'ON', 'OFF'][lightMode]); }
  if (e.code === 'KeyM') { muted = !muted; save.muted = muted; if (master) master.gain.value = muted ? 0 : 0.6; writeSave(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') setPaused(true); else if (state === 'paused') setPaused(false); }
  if (e.code === 'KeyF' && hasDesktop) window.desktop.fullscreen();
  if (e.code === 'KeyQ' && hasDesktop && (state === 'title' || state === 'paused')) { autosaveOnExit(); window.desktop.quit(); }
});
addEventListener('keyup', e => { if (KMAP[e.code]) { keys[KMAP[e.code]] = 0; e.preventDefault(); } });
cv.addEventListener('pointerdown', () => {
  initAudio();
  if (state === 'title') startGame(!!save.run);
  else if (state === 'dead' && deadT > 1.8) toTitle();
  else if (state === 'paused') setPaused(false);
});
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { keys[k] = 1; initAudio(); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, () => keys[k] = 0));
});
function setPaused(p) { if (p && state === 'play') { state = 'paused'; snapshotRun(); writeSave(); } else if (!p && state === 'paused') state = 'play'; }
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
function autosaveOnExit() { if (state === 'play' || state === 'paused') { snapshotRun(); writeSave(); } }
addEventListener('beforeunload', autosaveOnExit);

/* ============================ audio ============================ */
let AC = null, master = null, muted = false, A = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.nb = nb;
    const noise = () => { const s = AC.createBufferSource(); s.buffer = nb; s.loop = true; s.start(); return s; };
    const chain = (src, type, f, q, g) => { const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const ga = AC.createGain(); ga.gain.value = g; src.connect(fl); fl.connect(ga); ga.connect(master); return { fl, ga }; };
    A.o1 = AC.createOscillator(); A.o1.type = 'sawtooth'; A.o1.start();
    A.o2 = AC.createOscillator(); A.o2.type = 'square'; A.o2.start();
    const eg = AC.createGain(); eg.gain.value = 0; const ef = AC.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 320;
    A.o1.connect(ef); const o2g = AC.createGain(); o2g.gain.value = 0.5; A.o2.connect(o2g); o2g.connect(ef); ef.connect(eg); eg.connect(master);
    A.eng = eg; A.engF = ef;
    A.rain = chain(noise(), 'bandpass', 2600, 0.4, 0);
    A.wind = chain(noise(), 'lowpass', 520, 0.7, 0);
    A.rum = chain(noise(), 'lowpass', 190, 0.7, 0);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.setValueAtTime(v, t + Math.max(0.011, d - 0.03)); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function burst(dur, f0, f1, v, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = A.nb;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function sfxBoom() { burst(2.2, 2400, 50, 1.0); if (AC && !muted) { const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.2); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.4); } }
function sfxThunder() { burst(3.2, 380, 40, 0.8, rnd(0.2, 1.8)); }
function updateAudio() {
  if (!AC) return;
  const t = AC.currentTime, sp = speed / MAXSPEED;
  const live = state === 'play' || state === 'paused' ? (state === 'paused' ? 0 : 1) : state === 'title' ? 0.4 : 0;
  A.o1.frequency.setTargetAtTime(36 + sp * 90 + (keys.up ? 8 : 0), t, 0.08);
  A.o2.frequency.setTargetAtTime(18 + sp * 45, t, 0.08);
  A.eng.gain.setTargetAtTime(live * (0.07 + 0.07 * sp + (loading() ? 0.01 : 0)), t, 0.1);
  A.engF.frequency.setTargetAtTime(240 + sp * 420, t, 0.1);
  A.rain.ga.gain.setTargetAtTime(wx.rain * 0.2, t, 0.6);
  A.wind.ga.gain.setTargetAtTime((0.02 + 0.12 * sp + 0.18 * wx.storm) * (state === 'dead' ? 0.3 : 1), t, 0.4);
  A.rum.ga.gain.setTargetAtTime(state === 'play' && isOff ? 0.45 * (0.25 + sp) : 0, t, 0.1);
}

/* ============================ track ============================ */
const segments = [];
let N = 0, trackLen = 0;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
function addSeg(curve, y) {
  const n = segments.length;
  segments.push({
    index: n, curve, sprites: [], pw1: 0, pw2: 0, fence: 0, wire: 0, gv: 0, zs: false, ze: false, fog: 0, clip: 0,
    p1: { world: { x: 0, y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { x: 0, y: y, z: (n + 1) * SEG }, camera: {}, screen: {} }
  });
}
function addRoad(enter, hold, leave, curve, dy) {
  const sy = lastY(), ey = sy + dy, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSeg(easeIn(0, curve, n / enter), easeInOut(sy, ey, (n + 1) / total));
  for (let n = 0; n < hold; n++) addSeg(curve, easeInOut(sy, ey, (enter + n + 1) / total));
  for (let n = 0; n < leave; n++) addSeg(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n + 1) / total));
}
function buildTrack() {
  const R = mulberry(20240611), rr = (a, b) => a + R() * (b - a);
  addRoad(30, 40, 30, 0, 0);
  while (segments.length < 5600) {
    const enter = rr(25, 50) | 0, hold = rr(20, 80) | 0, leave = rr(25, 50) | 0;
    const curve = R() < 0.28 ? 0 : (R() < 0.5 ? -1 : 1) * rr(0.8, 2.6);
    let dy = (R() < 0.5 ? -1 : 1) * rr(0, 3200) * (R() < 0.55 ? 1 : 0.3);
    if (Math.abs(lastY() + dy) > 5500) dy = -dy;
    addRoad(enter, hold, leave, curve, dy);
    if (curve !== 0 && R() < 0.25) addRoad(enter, hold >> 1, leave, -curve * rr(0.6, 1), 0);
  }
  addRoad(40, 40, 40, 0, -lastY());
  N = segments.length; trackLen = N * SEG;
  // scenery
  let sec = 0, fence = 0, pole = 0, biome = 0;
  for (let i = 0; i < N; i++) {
    const seg = segments[i], sp = seg.sprites;
    seg.gv = (R() - 0.5) * 14;
    if (i >= sec) {
      sec = i + ((rr(90, 260) / 14) | 0) * 14 + 14;
      const f = R(); fence = f < 0.45 ? 0 : f < 0.65 ? -1 : f < 0.85 ? 1 : 2;
      pole = R() < 0.45 ? (R() < 0.5 ? -1 : 1) : 0; biome = (R() * 3) | 0;
    }
    seg.fence = fence; seg.wire = pole;
    if (fence && i % 2 === 0) { if (fence !== 1) sp.push({ t: 'post', off: -1.5 }); if (fence !== -1) sp.push({ t: 'post', off: 1.5 }); }
    if (pole && i % 14 === 0) sp.push({ t: 'pole', off: pole * 1.75 });
    for (const side of [-1, 1]) {
      const r = R(), v = R();
      if (biome === 0) {
        if (r < 0.42) sp.push({ t: R() < 0.85 ? 'tree' : 'dead', off: side * rr(1.9, 5.5), v });
        else if (r < 0.55) sp.push({ t: 'bush', off: side * rr(1.2, 3), v });
      } else if (biome === 1) {
        if (r < 0.03) sp.push({ t: 'bale', off: side * rr(2, 4), v });
        else if (r < 0.055) { const o = side * rr(2.2, 5); sp.push({ t: 'cow', off: o, v }, { t: 'cow', off: o + side * 0.5, v: 1 - v }); }
        else if (r < 0.06) sp.push({ t: 'barn', off: side * rr(4, 6.5), v });
        else if (r < 0.065) sp.push({ t: 'mill', off: side * rr(3.5, 6), v });
        else if (r < 0.09) sp.push({ t: 'tree', off: side * rr(2.4, 6), v });
        else if (r < 0.2) sp.push({ t: 'bush', off: side * rr(1.2, 3), v });
      } else {
        if (r < 0.06) sp.push({ t: 'rock', off: side * rr(1.2, 4), v });
        else if (r < 0.2) sp.push({ t: 'bush', off: side * rr(1.2, 3.5), v });
        else if (r < 0.26) sp.push({ t: 'dead', off: side * rr(1.8, 5), v });
        else if (r < 0.29) sp.push({ t: 'tree', off: side * rr(2.4, 6), v });
      }
    }
  }
}
buildTrack();
const findSeg = z => segments[Math.floor(z / SEG) % N];

/* ============================ sky / weather ============================ */
const SKY = [
  [0, [40, 55, 120], [95, 115, 175], 0.05], [5, [44, 60, 128], [105, 120, 180], 0.07],
  [6, [90, 105, 170], [250, 160, 115], 0.38], [7.5, [100, 160, 228], [245, 212, 175], 0.82],
  [10, [78, 148, 232], [188, 216, 242], 1], [16, [82, 150, 230], [198, 218, 238], 1],
  [17.8, [100, 125, 195], [250, 188, 125], 0.85], [19, [75, 75, 140], [240, 125, 95], 0.42],
  [20.3, [45, 58, 125], [110, 100, 150], 0.12], [24, [40, 55, 120], [95, 115, 175], 0.05]
];
function sampleSky(h) {
  let i = 0; while (i < SKY.length - 2 && h >= SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1], t = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
  return { top: mixc(a[1], b[1], t), hor: mixc(a[2], b[2], t), amb: lerp(a[3], b[3], t) };
}
const WS = {
  clear: { cloud: 0.06, rain: 0, next: ['cloudy'] },
  cloudy: { cloud: 0.55, rain: 0, next: ['clear', 'rain', 'clear'] },
  rain: { cloud: 0.85, rain: 0.55, next: ['cloudy', 'storm', 'storm'] },
  storm: { cloud: 1, rain: 1, next: ['rain'] }
};
let hour = 9, wxState = 'clear', wxTimer = 35, wx = { cloud: 0.06, rain: 0, storm: 0 };
let lightning = 0, boltT = 0, bolt = null, lightTimer = 6, lightLevel = 0, lightMode = 0, wind = 0.3;
let env = {};
function updateWeather(dt) {
  hour = (hour + dt * HOURS_PER_SEC) % 24;
  wxTimer -= dt;
  if (wxTimer <= 0) { const n = WS[wxState].next; wxState = n[(Math.random() * n.length) | 0]; wxTimer = rnd(35, 65); }
  const tg = WS[wxState], k = 1 - Math.exp(-dt / 4.5);
  wx.cloud += (tg.cloud - wx.cloud) * k; wx.rain += (tg.rain - wx.rain) * k;
  wx.storm = clamp((wx.rain - 0.45) / 0.55, 0, 1);
  wind = 0.3 + 0.7 * wx.storm * (0.6 + 0.4 * Math.sin(T * 0.7));
  lightning = Math.max(0, lightning - dt * 3.2); boltT = Math.max(0, boltT - dt);
  if (wx.storm > 0.5) {
    lightTimer -= dt;
    if (lightTimer <= 0) {
      lightning = 1; boltT = 0.3; lightTimer = rnd(2.5, 9) / (0.5 + wx.storm);
      const bx = rnd(0.1, 0.9) * W; bolt = [[bx, 0]]; let x = bx, y = 0;
      while (y < HOR) { x += rnd(-35, 35) * U; y += rnd(25, 55) * U; bolt.push([x, Math.min(y, HOR)]); }
      setTimeout(() => { lightning = Math.max(lightning, 0.8); }, 130);
      sfxThunder();
    }
  }
}
function updateEnv() {
  const s = sampleSky(hour), cl = wx.cloud;
  const sc2 = 0.35 + 0.65 * s.amb;
  const top = mixc(s.top, [62 * sc2, 70 * sc2, 84 * sc2], cl * 0.8);
  const hor = mixc(s.hor, [112 * sc2, 118 * sc2, 128 * sc2], cl * 0.8);
  let ambEff = s.amb * (1 - 0.5 * cl * (0.6 + 0.4 * wx.rain));
  ambEff = Math.min(1, ambEff + lightning * 0.6);
  env = { top, hor, amb: s.amb, ambEff, dark: clamp((1 - ambEff) * 0.9, 0, 0.82),
    fog: mixc(hor, [215, 195, 160], 0.28 * (1 - cl) * s.amb),
    fogDen: 3.0 + 2.5 * wx.rain + cl };
  const lon = lightMode === 1 || (lightMode === 0 && ambEff < 0.62);
  lightLevel += ((lon ? 1 : 0) - lightLevel) * Math.min(1, dtGlobal * 6);
}

/* ============================ game state ============================ */
let state = 'title', T = 0, dtGlobal = 0.016, deadT = 0, deadReason = '';
let position = 0, playerX = 0, speed = 0, steer = 0, odo = 0, heat = 0, pax = 0, stopsDone = 0, missed = 0;
let isOff = false, roll = 0, shake = 0, bgOff = 0, beepT = 0, warnT = 0, nextStopIn = 30, stop = null, braking = false, autoT = 0, busPhase = 0, saveT = 0;
let toasts = [], parts = [], fx = [], drops = [], stars = [], clouds = [], walkers = [];
for (let i = 0; i < 300; i++) drops.push({ x: Math.random(), y: Math.random(), v: rnd(900, 1500), l: rnd(14, 30) });
for (let i = 0; i < 150; i++) stars.push({ x: Math.random(), y: Math.random() * 0.95, s: rnd(0.6, 1.8), p: Math.random() * 6 });
for (let i = 0; i < 18; i++) clouds.push({ x: Math.random(), y: rnd(0.04, 0.34), s: rnd(0.7, 1.5), sp: rnd(0.6, 1.4), thr: i / 18 });
let cloudOff = 0;
const loading = () => stop && stop.state === 'loading';
const toast = (s, c) => toasts.push({ s, t: 3.2, c: c || '#fff' });

function resetRun() {
  position = 0; playerX = 0; speed = 0; steer = 0; odo = 0; heat = 0; pax = 0; stopsDone = 0; missed = 0;
  hour = 9; wxState = 'clear'; wxTimer = 30; wx.cloud = 0.06; wx.rain = 0; nextStopIn = 28; clearStop(true);
  parts = []; fx = []; walkers = []; toasts = [];
}
function startGame(cont) {
  initAudio();
  resetRun();
  if (cont && save.run) {
    const r = save.run;
    position = r.position % trackLen; playerX = r.playerX; speed = 0; odo = r.odo; heat = Math.min(r.heat, 0.9); pax = r.pax;
    stopsDone = r.stops; missed = r.missed; hour = r.hour; wxState = WS[r.wxState] ? r.wxState : 'clear'; wxTimer = r.wxTimer;
    wx.cloud = r.cloud; wx.rain = r.rain; nextStopIn = r.nextStopIn || 25;
    toast('Run restored — drive on!', '#9fe870');
  } else { save.run = null; toast('Hold UP/W to drive. Keep it on the road!'); }
  state = 'play'; saveT = 0;
}
function toTitle() { state = 'title'; resetRun(); position = rnd(0, trackLen); speed = 1800; }
function explode(reason) {
  state = 'dying'; deadT = 0; deadReason = reason || 'Engine blew up!'; shake = 1;
  sfxBoom();
  const cx = W / 2, cy = busBaseY() - busW * 0.5;
  for (let i = 0; i < 100; i++) { const a = rnd(0, 6.28), v = rnd(60, 520) * U; fx.push({ k: 'f', x: cx + rnd(-30, 30) * U, y: cy + rnd(-30, 30) * U, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140 * U, life: 0, max: rnd(0.6, 1.6), r: rnd(12, 46) * U }); }
  for (let i = 0; i < 60; i++) fx.push({ k: 's', x: cx + rnd(-60, 60) * U, y: cy + rnd(-40, 40) * U, vx: rnd(-90, 90) * U, vy: rnd(-260, -60) * U, life: 0, max: rnd(1.5, 3.4), r: rnd(20, 60) * U });
  for (let i = 0; i < 22; i++) fx.push({ k: 'd', x: cx + rnd(-60, 60) * U, y: cy, vx: rnd(-420, 420) * U, vy: rnd(-780, -200) * U, life: 0, max: 3, w: rnd(10, 40) * U, h: rnd(8, 26) * U, rot: rnd(0, 6), vr: rnd(-9, 9), c: [[228, 196, 90], [46, 108, 112], [60, 60, 64]][i % 3] });

    const pidx = findSeg(position + playerZ).index, rel = (stop.start - pidx + N) % N;
    if (stop.state === 'loading') {
      const w = 340 * U, x = W / 2 - w / 2, y = 150 * U + toasts.length * 28 * U;
      txt(stop.mode === 'board' ? 'BOARDING PASSENGERS...' : stop.mode === 'alight' ? 'LETTING PASSENGERS OFF...' : 'BOARDING & ALIGHTING...', W / 2, y, 20, '#ffd34d', 'center');
      ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(x, y + 10 * U, w, 16 * U, 8 * U); ctx.fill(); ctx.fillStyle = '#ffd34d'; rr(x, y + 10 * U, Math.max(8 * U, w * stop.prog / stop.need), 16 * U, 8 * U); ctx.fill();
      txt('Engine heating — hurry!', W / 2, y + 50 * U, 14, '#ff9a7a', 'center');
    } else if (rel < N / 2) {
      const inZone = ((pidx - stop.start + N) % N) < stop.len;
      txt(inZone ? 'PULL IN ON THE RIGHT & STOP' : 'BUS STOP  ➔  ' + Math.floor(rel * SEG / 180) + ' m', W / 2, 78 * U, 20, '#ffd34d', 'center');
    }
  }
  if (state === 'play' && isOff) {
    const a = 0.25 + 0.2 * Math.sin(T * 14), g2 = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85); g2.addColorStop(0, 'rgba(255,0,0,0)'); g2.addColorStop(1, 'rgba(255,30,20,' + a + ')');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    if (Math.sin(T * 14) > -0.2) txt('⚠ OFF ROAD ⚠', W / 2, H * 0.3, 34, '#ff5a4a', 'center');
  }
  if (state === 'play' && heat > 0.8 && Math.sin(T * 10) > 0) txt('ENGINE OVERHEATING!', W / 2, H * 0.36, 26, '#ff8a3a', 'center');
}
function overlayBox(lines, y0) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  lines.forEach((l, i) => txt(l[0], W / 2, y0 + i * 34 * U + (l[3] || 0), l[1], l[2], 'center'));
}
function drawScreens() {
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    txt('DUSTY ROAD BUS', W / 2, H * 0.2, 64, '#f2d98a', 'center', '800');
    txt('Drive as far as you can. Stay on the road.', W / 2, H * 0.2 + 40 * U, 20, '#fff', 'center', '500');
    const cont = !!save.run, y = H * 0.42;
    txt(cont ? 'ENTER  —  Continue run (' + fmtDist(save.run.odo / 180) + ')' : 'ENTER  —  Start driving', W / 2, y, 26, '#ffd34d', 'center');
    if (cont) txt('N  —  New run', W / 2, y + 36 * U, 20, '#fff', 'center');
    const l = ['W / ↑  gas     S / ↓ / SPACE  brake     A D / ← →  steer', 'H  headlights (auto/on/off)     M  mute     P  pause & save' + (hasDesktop ? '     F  fullscreen     Q  quit' : ''),
      'The bus creeps LEFT. Off-road: beeping, engine heats up, then BOOM.', 'Pull in at bus stops fast — the engine heats while you wait.'];
    l.forEach((s, i) => txt(s, W / 2, H * 0.62 + i * 28 * U, 16, '#e8dcc0', 'center', '500'));
    txt('Best ' + fmtDist(save.best) + '   ·   Total ' + fmtDist(save.totalDist) + '   ·   Runs ' + save.runs + '   ·   Stops ' + save.totalStops, W / 2, H * 0.9, 16, '#cdb98f', 'center', '600');
  } else if (state === 'paused') {
    overlayBox([['PAUSED', 54, '#f2d98a', 0], ['Progress saved.', 18, '#fff', 14], ['P / ESC / ENTER  —  resume', 20, '#ffd34d', 24]].concat(hasDesktop ? [['Q  —  save & quit', 18, '#fff', 24]] : []), H * 0.35);
  } else if (state === 'dead') {
    const dist = odo / 180, nb = dist >= save.best - 0.001 && dist > 0;
    overlayBox([[deadReason.toUpperCase(), 40, '#ff7a5a', 0], ['You drove ' + fmtDist(dist), 30, '#fff', 14], ['Stops completed: ' + stopsDone, 18, '#e8dcc0', 20], [nb ? 'NEW BEST DISTANCE!' : 'Best: ' + fmtDist(save.best), 22, nb ? '#9fe870' : '#cdb98f', 24], [deadT > 1.8 ? 'ENTER / click — back to menu' : '', 20, '#ffd34d', 44]], H * 0.3);
  }
}

/* ============================ frame ============================ */
function render() {
  ctx.save();
  if (shake > 0.01) ctx.translate((Math.random() - 0.5) * 14 * U * shake, (Math.random() - 0.5) * 10 * U * shake);
  drawWorld();
  ctx.restore();
  drawDarkness();
  drawNightSky();
  if (state !== 'title') drawBus(state === 'dying' || state === 'dead');
  else drawBus(false);
  drawParts();
  drawRain();
  drawLightning();
  drawFx();
  if (state === 'play' || state === 'paused') drawHUD();
  else if (state === 'dying' || state === 'dead') drawHUD();
  drawScreens();
}
let last = performance.now();
function frame(now) {
  let dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state !== 'paused') update(dt); else { dtGlobal = dt; updateAudio(); }
  render();
  requestAnimationFrame(frame);
}
window.__bus = { setHour: h => hour = h, setWeather: n => { wxState = n; wx.cloud = WS[n].cloud; wx.rain = WS[n].rain; wx.storm = clamp((wx.rain - 0.45) / 0.55, 0, 1); wxTimer = 999; },
  start: c => startGame(c), keys, get s() { return { state, heat, speed, playerX, odo, stop, pax, missed, isOff, N, pidx: findSeg(position + playerZ).index }; }, set: (k, v) => { ({ heat: () => heat = v, x: () => playerX = v, speed: () => speed = v, nextStop: () => nextStopIn = v })[k](); }, save: () => save };
loadSave().then(() => { toTitle(); requestAnimationFrame(frame); });
})();
</script>
